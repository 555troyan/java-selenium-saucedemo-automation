name: 555troyan UI Docker Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t sauce-tests .

      - name: Run Tests in Docker
        # Запускаем контейнер. Флаг --name нужен, чтобы потом найти его и забрать отчеты.
        # || true позволяет продолжить работу, даже если тесты упали.
        run: docker run --name sauce-container sauce-tests || true

      - name: Extract Allure Results from Container
        if: always()
        # Копируем папку с результатами из закрытого контейнера на сервер GitHub
        run: docker cp sauce-container:/app/allure-results ./allure-results

      - name: Cleanup Container
        if: always()
        run: docker rm sauce-container

      - name: Get Allure History
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages-dir

      - name: Build Allure Report
        uses: simple-elf/allure-report-action@master
        if: always()
        with:
          allure_results: allure-results
          allure_history: allure-history
          keep_reports: 20

      - name: Deploy report to Github Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-history
          publish_branch: gh-pages
